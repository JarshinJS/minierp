    post:
      operationId: boms_create
      tags:
      - boms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BOMWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BOMWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BOMWriteRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOMWrite'
          description: ''
  /api/boms/{id}/:
    get:
      operationId: boms_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Bill of Materials.
        required: true
      tags:
      - boms
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
