  /api/inventory/ledger/:
    get:
      operationId: inventory_ledger_list
      description: Stock movement ledger, newest first.
      parameters:
      - in: query
        name: entry_type
        schema:
          type: string
          enum:
          - ISSUE
          - RECEIPT
          - RELEASE
          - RESERVATION
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: string
        description: Product id
      - in: query
        name: reference
        schema:
          type: string
      tags:
      - inventory
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLedgerEntryList'
          description: ''
  /api/inventory/stock/:
    get:
      operationId: inventory_stock_list
      description: Current stock per active product.
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Category id
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Matches product name or SKU
      - in: query
        name: stock
        schema:
          type: string
          enum:
          - low_stock
          - out_of_stock
      tags:
      - inventory
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStockLevelList'
