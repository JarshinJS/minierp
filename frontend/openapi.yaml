  /api/dashboard/:
    get:
      operationId: dashboard_retrieve
      description: |-
        Everything the dashboard page shows, filtered to the user's role: KPI widgets,
        insights, production progress, recent activity, low stock and pending deliveries.
      tags:
      - dashboard
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverview'
          description: ''
  /api/dashboard/alerts/:
    get:
      operationId: dashboard_alerts_retrieve
      description: Operational alert counts for the header bell (same data as the
