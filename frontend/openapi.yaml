components:
  schemas:
    ActionEnum:
      enum:
      - created
      - updated
      - deleted
      - status_changed
      - price_changed
      - stock_adjusted
      - auto_created
      type: string
      description: |-
        * `created` - Created
        * `updated` - Updated
        * `deleted` - Deleted
        * `status_changed` - Status Changed
        * `price_changed` - Price Changed
        * `stock_adjusted` - Stock Adjusted
        * `auto_created` - Auto Created
    AdjustmentTypeEnum:
      enum:
      - RECEIPT
      - ISSUE
      type: string
      description: |-
        * `RECEIPT` - Receipt
        * `ISSUE` - Issue
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        user:
          type: string
          format: uuid
          nullable: true
        user_display:
          type: string
          readOnly: true
        module:
          type: string
          maxLength: 64
        record_type:
          type: string
          maxLength: 64
        record_id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/ActionEnum'
        field_changed:
          type: string
          maxLength: 128
        old_value:
          type: string
        new_value:
          type: string
      required:
      - action
      - id
      - module
      - record_id
      - record_type
      - timestamp
      - user_display
    BOM:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        reference:
          type: string
          description: e.g. BOM-001
          maxLength: 50
        product:
          type: string
          format: uuid
          nullable: true
          description: The finished product this BOM produces. Leave blank for templates.
        product_name:
          type: string
          readOnly: true
          nullable: true
        product_qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Quantity of finished product produced by one run of this BOM.
        is_active:
          type: boolean
        notes:
          type: string
        components:
          type: array
          items:
            $ref: '#/components/schemas/BOMComponent'
          readOnly: true
        operations:
          type: array
          items:
            $ref: '#/components/schemas/BOMOperation'
          readOnly: true
        total_material_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - components
      - created_at
      - id
      - name
      - operations
      - product_name
      - reference
      - total_material_cost
      - updated_at
    BOMComponent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        component:
          type: string
          format: uuid
          description: Raw material or sub-assembly consumed.
        component_name:
          type: string
          readOnly: true
        component_sku:
          type: string
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
        uom:
          type: string
          description: Unit of Measure (copied from component default, can be overridden).
          maxLength: 20
        sequence:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - component
      - component_name
      - component_sku
      - id
      - uom
    BOMOperation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        work_center:
          type: string
          format: uuid
        work_center_name:
          type: string
          readOnly: true
        name:
          type: string
          description: e.g. 'Cut wood panels', 'Sand & finish'
          maxLength: 255
        duration_minutes:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          description: Expected duration in minutes.
        sequence:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - id
      - name
      - work_center
      - work_center_name
    BOMWrite:
      type: object
      description: |-
        Write serializer — accepts flat header fields only.
        Components and operations are managed separately via the service layer.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        reference:
          type: string
          description: e.g. BOM-001
          maxLength: 50
        product:
          type: string
          format: uuid
          nullable: true
          description: The finished product this BOM produces. Leave blank for templates.
        product_qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Quantity of finished product produced by one run of this BOM.
        notes:
          type: string
      required:
      - id
      - name
      - reference
    BOMWriteRequest:
      type: object
      description: |-
        Write serializer — accepts flat header fields only.
        Components and operations are managed separately via the service layer.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        reference:
          type: string
          minLength: 1
          description: e.g. BOM-001
          maxLength: 50
        product:
          type: string
          format: uuid
          nullable: true
          description: The finished product this BOM produces. Leave blank for templates.
        product_qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Quantity of finished product produced by one run of this BOM.
        notes:
          type: string
      required:
      - name
      - reference
    BlockchainAuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          readOnly: true
        event_type_display:
          type: string
          readOnly: true
        reference_id:
          type: string
          readOnly: true
          description: UUID or order number of the related record
        reference_model:
          type: string
          readOnly: true
          description: Model name, e.g. ExportOrder
        data_hash:
          type: string
          readOnly: true
          description: SHA-256 hash of the event data
        blockchain_txn:
          type: string
          readOnly: true
          description: Blockchain transaction hash
        network:
          type: string
          readOnly: true
        block_number:
          type: integer
          readOnly: true
          nullable: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_by_name:
          type: string
          readOnly: true
          default: System
        metadata:
          readOnly: true
          description: Additional event context
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - block_number
      - blockchain_txn
      - created_at
      - created_by
      - created_by_name
      - data_hash
      - event_type
      - event_type_display
      - id
      - metadata
      - network
      - reference_id
      - reference_model
    BlockchainDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        document:
          type: string
          format: uuid
          readOnly: true
        document_title:
          type: string
          readOnly: true
        document_type:
          type: string
          readOnly: true
        document_hash:
          type: string
          readOnly: true
          description: SHA-256 hash of the document file
        blockchain_txn:
          type: string
          readOnly: true
          description: Blockchain transaction hash
        network:
          type: string
          readOnly: true
        block_number:
          type: integer
          readOnly: true
          nullable: true
        verified:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - block_number
      - blockchain_txn
      - created_at
      - document
      - document_hash
      - document_title
      - document_type
      - id
      - network
      - verified
    CSRFToken:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
      required:
      - name
    ChangeRoleRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
    Country:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        code:
          type: string
          description: ISO 3166-1 alpha-2/3
          maxLength: 3
        region:
          type: string
          maxLength: 100
      required:
      - code
      - id
      - name
    CountryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type: string
          minLength: 1
          description: ISO 3166-1 alpha-2/3
          maxLength: 3
        region:
          type: string
          maxLength: 100
      required:
      - code
      - name
    Currency:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          description: ISO 4217
          maxLength: 3
        name:
          type: string
          maxLength: 100
        symbol:
          type: string
          maxLength: 10
        exchange_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          description: Rate relative to base currency (e.g. 1 USD = X)
      required:
      - code
      - id
      - name
    CurrencyRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: ISO 4217
          maxLength: 3
        name:
          type: string
          minLength: 1
          maxLength: 100
        symbol:
          type: string
          maxLength: 10
        exchange_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          description: Rate relative to base currency (e.g. 1 USD = X)
      required:
      - code
      - name
    CurrentUser:
