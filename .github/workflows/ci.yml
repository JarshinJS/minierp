name: CI

# Verification only: this workflow never deploys, never pushes, and needs no secrets.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"
  # Throwaway key for Django to boot in CI. Not a secret, not used anywhere real.
  SECRET_KEY: ci-only-insecure-key-not-used-anywhere-else-0123456789abcdef

jobs:
  backend:
    name: Backend · tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # SQLite is what developers run locally; PostgreSQL is what production runs.
        database: [sqlite, postgres]
    services:
      postgres:
        # Disposable: the container lives only for this job; pytest-django also
        # creates and drops its own test_* database inside it.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minierp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Only the postgres leg sets it; config.settings.test refuses non-local hosts.
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@localhost:5432/minierp_ci' || '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Unit & integration tests
        run: python -m pytest -q --cov=apps --cov=core --cov-report=term-missing:skip-covered

  api-contract:
    name: API contract · OpenAPI in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - name: Committed schema matches the code
        working-directory: backend
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml
          diff -u ../frontend/openapi.yaml /tmp/openapi.yaml || {
            echo "::error::frontend/openapi.yaml is stale. Run 'npm run api' in frontend/ and commit the result."
            exit 1
          }

  frontend:
    name: Frontend · lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BACKEND_URL: http://127.0.0.1:8000

  e2e:
    name: End-to-end · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      # The not-yet-migrated Django pages need their Tailwind CSS, which is build
      # output (gitignored); backend/build.sh builds it the same way on deploy.
      - name: Build Django pages' CSS
        working-directory: backend
        run: npm ci && npm run build:css
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # playwright.config.ts starts both servers: Django (config.settings.e2e, a
      # throwaway SQLite database reset + seeded per run) and a production build of
      # Next.js proxying to it.
      - name: Run Playwright
        working-directory: frontend
        run: npm run e2e
        env:
          E2E_PYTHON: python
      - name: Upload HTML report, traces, videos and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
